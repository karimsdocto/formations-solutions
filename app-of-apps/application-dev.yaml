apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-messenger-dev
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://github.com/karimsdocto/formations-solutions/
    path: k8s/k8s/helm
    targetRevision: HEAD
    helm:
      valueFiles:
        - values/dev.yaml
  destination:
    name: in-cluster
    namespace: dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
