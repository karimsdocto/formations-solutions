apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-messenger
  namespace: argo-cd
spec:
  destination:
    name: in-cluster
    namespace: prod
  source:
    path: k8s/k8s/helm
    repoURL: https://github.com/karimsdocto/formations-solutions/
    targetRevision: HEAD
  sources: []
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true